name: Daily Flyer Crawler & Deals Update

on:
  workflow_dispatch: # 手動実行のみに制限（ローカルでの厳格検証データ配信を優先）

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Tokyo'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright pypdf pillow
          playwright install --with-deps chromium

      - name: Run Crawler & Update Deals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u run_daily.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add latest_deals.json deals.db today_report.txt
          git commit -m "chore(auto): update deals data [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
